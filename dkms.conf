PACKAGE_NAME="r92su"
PACKAGE_VERSION="0.1"

BUILT_MODULE_NAME[0]="r92su"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# Older kernels have the staging r8712u driver for these devices (see README.md).
BUILD_EXCLUSIVE_KERNEL_MIN="6.13"
# The kernel options the driver needs (kconfig.require).
BUILD_EXCLUSIVE_CONFIG="CONFIG_USB CONFIG_CFG80211 CONFIG_CRYPTO_LIB_ARC4 CONFIG_CRYPTO_CCM CONFIG_CRYPTO_AES"
